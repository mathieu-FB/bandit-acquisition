<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandit SAV — Restock à venir</title>
  <link rel="icon" href="/img/bandit-logo-noir.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/bandit-ui.css">
  <style>
    header { background: var(--jaune); padding: 18px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    header img { width: 110px; display: block; }
    header h1 { font-size: 20px; }
    header .subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    main { padding: 16px 24px 40px; max-width: 1400px; margin: 0 auto; }
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .kpi { padding: 12px 14px; }
    .kpi .label { font: 700 10.5px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--text-secondary); }
    .kpi .value { font: 800 24px/1 var(--display); margin-top: 6px; }
    .kpi.rupture .value { color: var(--red); }
    .kpi.restock .value { color: var(--green); }
    .filters { background: #fff; border: 1px solid var(--border); padding: 10px 12px; margin-bottom: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .filters input[type="search"] { min-width: 260px; flex: 1; max-width: 420px; }
    .filters .refresh-btn { margin-left: auto; border: 2px solid var(--charbon); background: var(--charbon); color: #fff; padding: 9px 12px; font: 800 11px var(--display); text-transform: uppercase; cursor: pointer; }
    .filters .refresh-btn:hover { box-shadow: 3px 3px 0 var(--jaune); }
    .filters .last-sync { font-size: 11px; color: var(--text-muted); }
    table { border: 1px solid var(--border); }
    .sku-cell .sku-code { font-family: var(--mono); font-weight: 700; font-size: 13px; }
    .sku-cell .sku-nom { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
    .sku-cell .sku-ean { color: var(--text-muted); font-size: 10px; font-family: var(--mono); margin-top: 2px; }
    .stock { font-weight: 800; font-family: var(--display); }
    .stock.rupture { color: var(--red); } .stock.faible { color: var(--amber); } .stock.ok { color: var(--green); }
    .restock-cell { text-align: right; }
    .restock-cell.no { color: var(--text-muted); font-style: italic; font-size: 12px; }
    .restock-cell .date { font-weight: 700; color: var(--green); }
    .restock-cell .qte { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .thumb { width: 32px; height: 32px; background: var(--paper); border: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .thumb img { max-width: 100%; max-height: 100%; }
    .fam-cell { font-size: 12px; color: var(--text-muted); }
    @media (max-width: 640px) { .fam-cell, .ean-hide { display: none; } main { padding: 8px 12px; } }
  </style>
</head>
<body>
  <header>
    <img src="/img/bandit-logo-noir.svg" alt="French Bandit">
    <div>
    <h1>SAV · Restock à venir</h1>
    <div class="subtitle">Recherche un produit pour savoir quand il revient en stock. Info mise à jour en continu depuis les BDC en cours.</div>
    </div>
  </header>
  <main>
    <div id="kpiRow" class="kpi-row"></div>
    <div class="filters">
      <input type="search" id="q" placeholder="Rechercher par SKU, nom ou EAN…" autofocus>
      <select id="filter">
        <option value="all">Tous les produits</option>
        <option value="rupture" selected>En rupture uniquement</option>
        <option value="rupture_with_restock">Rupture avec restock à venir</option>
        <option value="with_restock">Avec restock dans 60j</option>
        <option value="rupture_no_restock">Rupture SANS restock</option>
      </select>
      <span class="last-sync" id="lastSyncInfo"></span>
      <button class="refresh-btn" id="btnRefresh">↻ Actualiser</button>
    </div>
    <div id="content" class="loading">Chargement…</div>
  </main>
  <script>
    let DATA = null;

    async function load() {
      const content = document.getElementById('content');
      content.className = 'loading';
      content.textContent = 'Chargement…';
      try {
        const res = await fetch('/api/sav/restock', { credentials: 'same-origin' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        DATA = await res.json();
        renderKpis();
        renderTable();
      } catch (err) {
        content.className = 'empty-state';
        content.textContent = 'Erreur : ' + err.message;
      }
    }

    function renderKpis() {
      const el = document.getElementById('kpiRow');
      el.innerHTML = `
        <div class="kpi"><div class="label">Total SKU actifs</div><div class="value">${DATA.total}</div></div>
        <div class="kpi rupture"><div class="label">En rupture</div><div class="value">${DATA.en_rupture}</div></div>
        <div class="kpi restock"><div class="label">Avec restock 60j</div><div class="value">${DATA.avec_restock}</div></div>
      `;
      const lastSync = document.getElementById('lastSyncInfo');
      lastSync.textContent = 'Data au ' + new Date(DATA.today).toLocaleString('fr-FR', { timeZone: 'Europe/Paris' });
    }

    function renderTable() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const filter = document.getElementById('filter').value;
      const filtered = DATA.items.filter(i => {
        if (filter === 'rupture' && i.stock_actuel !== 0) return false;
        if (filter === 'rupture_with_restock' && (i.stock_actuel !== 0 || !i.prochain_restock)) return false;
        if (filter === 'with_restock' && i.restock_total_60j <= 0) return false;
        if (filter === 'rupture_no_restock' && (i.stock_actuel !== 0 || i.prochain_restock)) return false;
        if (q) {
          const hay = (i.sku + ' ' + (i.nom || '') + ' ' + (i.ean_13 || '')).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      const container = document.getElementById('content');
      container.className = '';
      if (filtered.length === 0) {
        container.className = 'empty-state';
        container.textContent = 'Aucun SKU ne correspond aux filtres.';
        return;
      }
      const rows = filtered.map(i => {
        const stockClass = i.stock_actuel === 0 ? 'rupture' : (i.stock_actuel < 20 ? 'faible' : 'ok');
        let restockCell;
        if (i.prochain_restock) {
          const d = new Date(i.prochain_restock.date);
          const dateStr = d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
          restockCell = `<div class="date">${dateStr}</div><div class="qte">${i.prochain_restock.qte} unités (${i.prochain_restock.bdc})</div>`;
        } else {
          restockCell = '<span class="no">Aucun restock planifié</span>';
        }
        return `
          <tr>
            <td><div class="thumb">${i.image_url ? `<img src="${escapeAttr(i.image_url)}" loading="lazy">` : ''}</div></td>
            <td class="sku-cell">
              <div class="sku-code">${escapeHtml(i.sku)}</div>
              <div class="sku-nom">${escapeHtml(i.nom || '')}</div>
              ${i.ean_13 ? `<div class="sku-ean ean-hide">${escapeHtml(i.ean_13)}</div>` : ''}
            </td>
            <td class="fam-cell">${escapeHtml(i.famille || '')} / ${escapeHtml(i.animal || '')}</td>
            <td class="stock ${stockClass}">${i.stock_actuel}</td>
            <td class="restock-cell">${restockCell}</td>
            <td class="restock-cell">${i.restock_total_60j > 0 ? `<strong>${i.restock_total_60j}</strong> u <span class="muted">(${i.bdc_en_cours_count} BDC)</span>` : '<span style="color:#9ca3af;">—</span>'}</td>
          </tr>`;
      }).join('');
      container.innerHTML = `
        <div style="margin-bottom:8px;color:#6b7280;font-size:12px;">${filtered.length} SKU affichés sur ${DATA.total}</div>
        <table>
          <thead>
            <tr>
              <th></th>
              <th>SKU / Nom</th>
              <th>Famille</th>
              <th style="text-align:right;">Stock actuel</th>
              <th style="text-align:right;">Prochain restock</th>
              <th style="text-align:right;">Total 60j</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

    document.getElementById('q').addEventListener('input', () => DATA && renderTable());
    document.getElementById('filter').addEventListener('change', () => DATA && renderTable());
    document.getElementById('btnRefresh').addEventListener('click', load);

    load();
  </script>
</body>
</html>
